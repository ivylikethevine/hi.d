name: Release

# Only ever fires on a pushed v* tag. Nothing here runs on a branch push or a
# PR - ci.yml owns those and publishes nothing.
on:
  push:
    tags:
      - "v*"

# read-only by default; only the gated publish job gets `contents: write`
permissions:
  contents: read

jobs:
  # Everything that can fail, and nothing that can publish. Runs unattended so
  # that a bad tag is caught before anyone is asked to approve anything.
  build:
    name: build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install zsh and fish
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      # same pinned upstream binary ci.yml uses - the distro package lags badly
      - uses: ./.github/actions/setup-shellcheck

      # The tarball both channels checksum only exists once the tag does, so
      # the bump runs here, not before tagging (which needed a force-retag).
      # Review happens at the environment gate, over the files this produced.
      - name: Regenerate the manifests from the tag
        run: packaging/bump.sh "${GITHUB_REF_NAME#v}"

      - name: Verify the result
        run: packaging/bump.sh --check "${GITHUB_REF_NAME#v}"

      # after the bump, so the packaging drift guards in the fast group run
      # against the manifests this release will actually ship
      - name: Run fast test suites
        run: "${{ github.workspace }}/tests/test_runner.sh --group fast"

      - uses: ./.github/actions/setup-nfpm

      # asserts one artifact per format and writes dist/SHA256SUMS itself
      - name: Build the packages
        run: packaging/package.sh

      - name: Collect the manifests alongside them
        run: |
          set -euo pipefail
          mkdir -p dist/manifests
          cp packaging/aur/hi.d/PKGBUILD dist/manifests/PKGBUILD
          cp packaging/aur/hi.d/.SRCINFO dist/manifests/.SRCINFO
          cp packaging/aur/hi.d-git/PKGBUILD dist/manifests/PKGBUILD.git
          cp packaging/aur/hi.d-git/.SRCINFO dist/manifests/.SRCINFO.git
          cp packaging/homebrew/hi.d.rb dist/manifests/hi.d.rb

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/SHA256SUMS
            dist/manifests/*
          if-no-files-found: error

  # The only job that publishes, and it waits for you.
  #
  # `environment: release` is what makes GitHub hold this job in a pending state
  # until a required reviewer approves it in the web UI. THAT REVIEWER IS NOT
  # CONFIGURED BY THIS FILE - it is a repo setting, and until it exists the
  # environment imposes no gate at all and this job runs unattended. One-time
  # setup: Settings -> Environments -> New environment -> "release" -> tick
  # "Required reviewers" and add yourself. See packaging/README.md.
  publish:
    name: publish to the release (manual approval)
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Attach everything to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          # The manifests ride along with the packages so that updating the AUR
          # and the tap is a copy rather than a re-derivation of the same sums.
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/*.deb dist/*.rpm dist/*.apk dist/SHA256SUMS dist/manifests/*

      # Committing the regenerated manifests here - after the human gate - is
      # what lets the tag stay put: they are consumed from the AUR/tap repos,
      # not from inside the tarball, so they needn't be in the tagged tree.
      # the one checkout that keeps its credentials: the step below pushes to
      # main with them (every other checkout sets persist-credentials: false)
      - uses: actions/checkout@v4 # zizmor: ignore[artipacked]
        with:
          ref: main
          path: main

      - name: Commit the manifests to main
        run: |
          set -euo pipefail
          cp dist/manifests/PKGBUILD main/packaging/aur/hi.d/PKGBUILD
          cp dist/manifests/.SRCINFO main/packaging/aur/hi.d/.SRCINFO
          cp dist/manifests/hi.d.rb main/packaging/homebrew/hi.d.rb
          cd main
          if git diff --quiet; then
            echo "manifests already current on main - nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/aur/hi.d/PKGBUILD packaging/aur/hi.d/.SRCINFO packaging/homebrew/hi.d.rb
          git commit -m "packaging: manifests for $GITHUB_REF_NAME"
          git push origin main
