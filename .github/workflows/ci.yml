name: CI

on:
  pull_request:
  # the README badges report branch status - a PR-only trigger left them lying
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# superseded PR pushes cancel their in-flight run; main/develop never cancel
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: fast suites (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh and fish
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - uses: ./.github/actions/setup-shellcheck

      - name: Run fast test suites
        env:
          _HI_HOME: ${{ github.workspace }}/..
        run: "${{ github.workspace }}/tests/test_runner.sh --group fast"

  # The same suites on macOS: /bin/bash 3.2, BSD userland. The %e/width/sort
  # fixes in common/ came out of this job, so it gates for real now.
  test-macos:
    name: fast suites (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # zsh is macOS's own login shell, so only fish and shellcheck are missing
      - name: Install fish and shellcheck
        run: brew install fish shellcheck

      - name: Run fast test suites
        env:
          _HI_HOME: ${{ github.workspace }}/..
        run: "${{ github.workspace }}/tests/test_runner.sh --group fast"

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
          config: ".markdownlint.yaml"

  # catches nfpm.yaml/install_tree breakage on the PR that causes it, not at
  # the next release tag
  packaging-smoke:
    name: package build (deb, rpm, apk)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install nfpm
        env:
          NFPM_VERSION: 2.43.0
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo mv /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Build the packages
        run: packaging/package.sh

      - name: Assert all three formats were built
        run: ls -l dist/*.deb dist/*.rpm dist/*.apk

  e2e:
    name: e2e (ssh, docker)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # --require-run: here a skip is a broken runner, not an optional backend
      - name: Run end-to-end suites
        env:
          _HI_HOME: ${{ github.workspace }}/..
        run: "${{ github.workspace }}/tests/test_runner.sh --require-run --group e2e"

  e2e-backends:
    name: e2e (podman, nomad, kube)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install podman and nomad
        run: |
          set -euo pipefail
          curl -sSfL https://apt.releases.hashicorp.com/gpg |
            sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" |
            sudo tee /etc/apt/sources.list.d/hashicorp.list >/dev/null
          sudo apt-get update && sudo apt-get install -y podman nomad
          nomad version

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Run backend end-to-end suites
        env:
          _HI_HOME: ${{ github.workspace }}/..
        run: "${{ github.workspace }}/tests/test_runner.sh --require-run --group backends"
