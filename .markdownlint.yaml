# Default state for all rules
default: true

# MD013/line-length - Line length
# MD049 defaults to "consistent", which infers the style from whichever
# emphasis a file happens to use first - so the same text is a violation in one
# file and correct in the next, and a generated or pasted paragraph flips a
# whole file's expectation. Naming the style is what makes the answer the same
# everywhere. Underscore because that is what the docs already overwhelmingly
# use; `**bold**` is MD050's business and stays asterisks.
MD049:
  style: underscore

MD013:
  line_length: 9999
  tables: false
  stern: false
  code_blocks: false
  heading_line_length: 9999
