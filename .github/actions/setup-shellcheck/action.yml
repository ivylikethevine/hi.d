name: Setup shellcheck
# ubuntu's apt package lags upstream badly, and a brew install floats; one
# pinned install shared by ci.yml (both OSes) and release.yml - bump the
# default here and all three follow. Linux and macOS runners both covered, so
# the two fast-suite jobs lint shell with the same version and cannot disagree.
description: Install a pinned upstream shellcheck binary, with caching

inputs:
  version:
    description: shellcheck version to install
    required: false
    default: "0.11.0"

runs:
  using: composite
  steps:
    - name: Cache shellcheck
      id: shellcheck-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /usr/local/bin/shellcheck
        key: shellcheck-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

    # the body lives in install.sh rather than inline, so the repo's own lint
    # suite (shellcheck, shfmt) reads it - actionlint only covers run: blocks
    # in workflows, and these scripts curl, untar and sudo mv
    - name: Install shellcheck
      if: steps.shellcheck-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SHELLCHECK_VERSION: ${{ inputs.version }}
      run: '"$GITHUB_ACTION_PATH/install.sh"'
