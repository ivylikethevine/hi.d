# Keeps the SHA-pinned `uses:` in the workflows, the setup-tool action AND the
# digest-pinned base images in tests/dockerfiles moving via PRs instead of
# memory. What this does not cover: the curl-installed tool versions in
# .github/actions/setup-tool/tools.txt (shellcheck, shfmt, checkbashisms,
# actionlint, zizmor, nfpm, minisign, kcov) - those move by editing that file's
# version column, and dependabot has no ecosystem for them; the tool-versions
# workflow watches that drift instead.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    # let a new action release age before a bump PR shows up - a freshly
    # compromised release's window is its first days (zizmor: dependabot-cooldown)
    cooldown:
      default-days: 7

  # The three upstream base images the test fixtures build on, pinned by digest
  # in tests/dockerfiles/*.Dockerfile. A digest never moves, which is the point
  # and also the hazard: without this, `alpine:3.24` would keep meaning whatever
  # it meant the day it was pinned, security fixes included, and nothing would
  # say so. The `docker` ecosystem reads Dockerfiles specifically - the same
  # images named in shell (tests/test_lib.sh, docs/tapes/fixtures.sh) are out of
  # its reach, which is why those stay on tags.
  - package-ecosystem: docker
    directory: "/tests/dockerfiles"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # bash:3.2 is a constant, not a version to keep current. That image is the
    # bash 3.2 floor - the version macOS still ships and the one every bash 4
    # builtin hi might reach for is missing from (sshd-bash32.Dockerfile says
    # so) - and a bump to bash:5 would leave the suite green while testing
    # nothing it exists to test. Only the semver update-types are ignored, so
    # digest refreshes within 3.2 still arrive: the tag stays put, the layers
    # underneath it stay current.
    ignore:
      - dependency-name: "bash"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
