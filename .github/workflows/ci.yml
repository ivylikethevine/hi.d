name: CI

on:
  pull_request:

jobs:
  test:
    name: fast suites (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh and fish
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      # ubuntu-latest's apt package lags upstream badly so we install
      # the latest upstream binary
      - name: Cache shellcheck
        id: shellcheck-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/shellcheck
          key: shellcheck-0.11.0-linux-x86_64

      - name: Install shellcheck
        if: steps.shellcheck-cache.outputs.cache-hit != 'true'
        env:
          SHELLCHECK_VERSION: 0.11.0
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          sudo mv "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf /tmp/shellcheck.tar.xz "/tmp/shellcheck-v${SHELLCHECK_VERSION}"
          shellcheck --version

      - name: Run fast test suites
        env:
          _HI_HOME: ${{ github.workspace }}/..
        run: "${{ github.workspace }}/tests/test_runner.sh --group fast"

  # The same suites on macOS, where /bin/bash is 3.2. hi is written to run there
  # (no mapfile, no associative arrays, no namerefs - see the bash-4 lint in
  # tests/shells/shellcheck_test.sh, and the real bash 3.2 target
  # tests/targets/ssh_test.sh boots), and the whole fast group passes under 3.2
  # in a container. What is still unproven from Linux is the BSD userland this
  # runner brings with it - sed/awk/du/stat/mktemp flags - so the job stays
  # advisory. Flip continue-on-error off once a run here comes back green.
  test-macos:
    name: fast suites (macos-latest)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # zsh is macOS's own login shell, so only fish and shellcheck are missing
      - name: Install fish and shellcheck
        run: brew install fish shellcheck

      - name: Run fast test suites
        env:
          _HI_HOME: ${{ github.workspace }}/..
        run: "${{ github.workspace }}/tests/test_runner.sh --group fast"

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
          config: ".markdownlint.yaml"

  e2e:
    name: e2e (ssh, docker)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Run end-to-end suites
        env:
          _HI_HOME: ${{ github.workspace }}/..
        run: "${{ github.workspace }}/tests/test_runner.sh --group e2e"

  e2e-backends:
    name: e2e (podman, nomad, kube)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install podman and nomad
        run: |
          set -euo pipefail
          curl -sSfL https://apt.releases.hashicorp.com/gpg |
            sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" |
            sudo tee /etc/apt/sources.list.d/hashicorp.list >/dev/null
          sudo apt-get update && sudo apt-get install -y podman nomad
          nomad version

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Run backend end-to-end suites
        env:
          _HI_HOME: ${{ github.workspace }}/..
        run: "${{ github.workspace }}/tests/test_runner.sh --group backends"
