name: Setup shfmt
# a single upstream Go binary, pinned the same way shellcheck is - bump the
# default here and every consumer follows. Version drift matters more for a
# formatter than most linters: two shfmt versions can disagree about the one
# true formatting, and the gate compares against exactly one of them.
description: Install a pinned upstream shfmt binary, with caching

inputs:
  version:
    description: shfmt version to install
    required: false
    default: "3.13.1"

runs:
  using: composite
  steps:
    - name: Cache shfmt
      id: shfmt-cache
      uses: actions/cache@v4
      with:
        path: /usr/local/bin/shfmt
        key: shfmt-${{ inputs.version }}-linux-x86_64

    - name: Install shfmt
      if: steps.shfmt-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SHFMT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        curl -sSfL -o /tmp/shfmt \
          "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
        chmod +x /tmp/shfmt
        sudo mv /tmp/shfmt /usr/local/bin/shfmt
        shfmt --version
