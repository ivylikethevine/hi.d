# hi.d's tmux config, in the same spirit as misc/vim.rc and misc/nano.rc:
# reached through the `tmux` alias in shells/aliases.sh (`tmux -f <this file>`),
# overridable wholesale by dropping your own copy at ~/.config/hi.d/tmux.conf,
# and off entirely via _HI_DISABLE_TMUX=1.
#
# Two things worth knowing before editing:
#
#   - `-f` is read when the *server* starts, not when a client attaches. Attach
#     to a server someone else started and none of this applies - that is tmux's
#     rule, not ours.
#   - The alias is defined only when hi.d is permanent on this machine (no
#     $_HI_CLEANUP). A detached tmux outlives the ssh session, and on an
#     ephemeral target the tree it was reading is deleted on exit - every shell
#     inside that tmux would wake up pointing at a directory that no longer
#     exists. shells/aliases.sh is where that decision is made.

# --- what hi needs -----------------------------------------------------------

# A shell started in a new window inherits the *session's* environment, which
# tmux refreshes from the attaching client on every attach - but only for the
# variables named here. Without this, `tmux new-window` inside a hi session
# gives you a shell whose $_HI_HOME is gone, so hi's rc sources nothing and you
# get a bare prompt in half your panes. -ga appends to tmux's own default list
# (DISPLAY, SSH_AUTH_SOCK and friends), which we have no business dropping.
set -ga update-environment " _HI_HOME _HI_ROOT _HI_CONFIG_DIR _HI_REMOTE_SESSION"
set -ga update-environment " _HI_TARGET _HI_TARGET_COLOR _HI_TARGET_TAG"
set -ga update-environment " _HI_LOCAL_USER _HI_LOCAL_HOSTNAME _HI_RELEASE _HI_ASCII"

# The clipboard, both halves of it: set-clipboard lets tmux answer a program's
# OSC 52 itself, and allow-passthrough lets the DCS-wrapped escape
# shells/osc52.sh emits reach the outer terminal when tmux doesn't.
set -g set-clipboard on
set -g allow-passthrough on

# --- terminal ----------------------------------------------------------------

# tmux-256color is the correct entry but is missing from older terminfo trees;
# screen-256color exists everywhere tmux does. Same trade hi.sh's TERM fallback
# makes on connect.
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc" # truecolor when the outer term has it
set -g escape-time 10                     # the vim-Esc-lag default of 500ms is indefensible
set -g focus-events on

# --- behaviour ---------------------------------------------------------------

set -g mouse on
set -g history-limit 20000
set -g base-index 1        # the leftmost window is 1, where the key is
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
setw -g mode-keys vi

# --- status ------------------------------------------------------------------
#
# The same information hi's prompt carries, in the same order: user@host on the
# left, so a pane on a remote box says so without running anything.

set -g status-interval 5
set -g status-style "bg=default,fg=white"
set -g status-left-length 40
set -g status-left " #[fg=cyan,bold]#(whoami)#[fg=default]@#[fg=magenta,bold]#h#[default] "
set -g status-right "#[fg=blue]#S#[default] %b %e %H:%M "
setw -g window-status-current-style "fg=green,bold"
setw -g window-status-style "fg=white"
set -g pane-active-border-style "fg=magenta"
set -g pane-border-style "fg=brightblack"
set -g message-style "bg=default,fg=yellow"
