name: Coverage

# Monthly kcov over the fast suites, published as an artifact - visibility,
# never a gate: no PR waits on this and no threshold fails it. The question it
# keeps answerable is "which arms of install.sh/bump.sh do the ~500 cases
# never touch". Dispatchable for a dry run.
on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kcov:
    name: kcov over the fast suites
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      # hands the persistent self-hosted workspace back to the runner user, so
      # checkout's own cleanup can always finish - see docs/PACKAGING.md
      - name: Reclaim the workspace
        if: ${{ runner.environment != 'github-hosted' }}
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the libs after fish are kcov's runtime ones: setup-tool caches the
      # built binary, so on a cache hit nothing else pulls them in
      - name: Install zsh, fish and kcov's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish libdw1 libelf1 libcurl4 zlib1g libstdc++6

      # kcov is pinned and built from its GitHub source tarball like every
      # other tool here: it publishes no binary asset, and it reaches Debian
      # and Ubuntu only through a PPA - so `apt-get install kcov` is not a
      # thing this runner (or a contributor's machine) can rely on.
      - uses: ./.github/actions/setup-tool
        with:
          tool: kcov

      # the shellcheck suite runs under kcov too; same pinned binary as ci.yml
      - uses: ./.github/actions/setup-tool
        with:
          tool: shellcheck

      - name: Run the fast suites under kcov
        run: tests/coverage.sh coverage-report

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: error
          retention-days: 90
