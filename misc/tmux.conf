# hi.d's tmux config, reached like misc/vim.rc is - through an alias
# (`tmux -f <this file>`), overridable by dropping your own at
# ~/.config/hi.d/tmux.conf, off entirely via _HI_DISABLE_TMUX=1.
# GLOSSARY: tmux server-start rules - when -f applies, where the alias exists

# --- what hi needs -----------------------------------------------------------

# A new window inherits the *session's* environment, which tmux refreshes from
# the attaching client - but only for the variables named here. Without them,
# `tmux new-window` inside a hi session gives you a shell whose $_HI_HOME is
# gone. -ga, never -g: tmux's own defaults (DISPLAY, SSH_AUTH_SOCK) are not ours
# to drop.
set -ga update-environment " _HI_HOME _HI_ROOT _HI_CONFIG_DIR _HI_REMOTE_SESSION"
set -ga update-environment " _HI_TARGET _HI_TARGET_COLOR _HI_TARGET_TAG"
set -ga update-environment " _HI_LOCAL_USER _HI_LOCAL_HOSTNAME _HI_RELEASE _HI_ASCII"

# both halves of the clipboard story (shells/osc52.sh): answer OSC 52 ourselves,
# and let the DCS-wrapped escape through when we don't
set -g set-clipboard on
set -g allow-passthrough on

# --- terminal ----------------------------------------------------------------

# tmux-256color is correct but missing from older terminfo trees;
# screen-256color exists everywhere tmux does. Same trade hi.sh's TERM fallback
# makes on connect.
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc" # truecolor when the outer term has it
set -g escape-time 10                     # the 500ms default is vim-Esc lag
set -g focus-events on

# --- behaviour ---------------------------------------------------------------

set -g mouse on
set -g history-limit 20000
set -g base-index 1 # the leftmost window is 1, where the key is
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
setw -g mode-keys vi

# --- status ------------------------------------------------------------------
# what hi's prompt carries, in the same order: a pane on a remote box says so
# without running anything

set -g status-interval 5
set -g status-style "bg=default,fg=white"
set -g status-left-length 40
set -g status-left " #[fg=cyan,bold]#(whoami)#[fg=default]@#[fg=magenta,bold]#h#[default] "
set -g status-right "#[fg=blue]#S#[default] %b %e %H:%M "
setw -g window-status-current-style "fg=green,bold"
setw -g window-status-style "fg=white"
set -g pane-active-border-style "fg=magenta"
set -g pane-border-style "fg=brightblack"
set -g message-style "bg=default,fg=yellow"
