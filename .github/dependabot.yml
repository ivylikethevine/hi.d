# Keeps the SHA-pinned `uses:` in the workflows AND the composite actions
# moving via PRs instead of memory. What this does not cover: the curl-installed
# tool versions inside the setup-* composite actions (shellcheck, shfmt,
# checkbashisms, actionlint, nfpm) - those move by editing the action's
# `version` default, and dependabot has no ecosystem for them.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    # let a new action release age before a bump PR shows up - a freshly
    # compromised release's window is its first days (zizmor: dependabot-cooldown)
    cooldown:
      default-days: 7
