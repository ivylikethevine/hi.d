name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dash/bash/shellcheck ship on ubuntu-latest already; zsh/fish don't -
      # install them so alias_test.sh/alias_fallthrough_test.sh get full
      # shell coverage instead of silently skipping (both tests skip
      # whatever shell isn't installed, rather than failing on it)
      - name: Install zsh and fish
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      # actions/checkout puts the repo at $GITHUB_WORKSPACE, which is
      # .../work/hi.d/hi.d since this repo is named hi.d - so hi.d's own
      # paths.sh ($_HI_ROOT="$_HI_HOME/hi.d") is satisfied by pointing
      # _HI_HOME at its parent, no copying needed
      - name: Run fast test suites
        env:
          _HI_HOME: ${{ github.workspace }}/..
        run: "${{ github.workspace }}/tests/test_runner.sh aliases alias_fallthrough shellcheck"
