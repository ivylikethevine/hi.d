name: Tool versions

# Weekly drift check over the curl-installed tools in setup-tool's tools.txt -
# the one class of pin dependabot cannot see (its own config says so). A red
# run with ::warning annotations is the signal; the bump itself stays a
# one-line edit to that file's version column.
#
# That annotation is also why this workflow still exists rather than being
# folded into Renovate, which could watch the same pins: the reasoning is in
# .github/dependabot.yml's header, and the answer there is no.
on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: composite-action tool pins vs upstream
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # hands the persistent self-hosted workspace back to the runner user, so
      # checkout's own cleanup can always finish - see docs/PACKAGING.md
      - name: Reclaim the workspace
        if: ${{ runner.environment != 'github-hosted' }}
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare pinned defaults to upstream releases
        run: .github/scripts/check_tool_versions.sh
