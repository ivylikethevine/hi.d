name: Scorecard

# OpenSSF Scorecard, dispatch-only for now: run it, read the report from the
# artifact, and only then decide about publishing results and a README badge
# (publish_results and a schedule are the follow-up, not the first step).
on:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: supply-chain scorecard
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    # workflow_dispatch is this workflow's only trigger, and dispatch already
    # needs write access - this is the second lock: an environment with a
    # required reviewer on it. Note that an environment with *no* reviewer
    # configured is no gate at all - the same caveat release.yml's `release`
    # environment carries. docs/ROADMAP.md holds the one-time setup step.
    environment: manual-dispatch
    steps:
      # hands the persistent self-hosted workspace back to the runner user, so
      # checkout's own cleanup can always finish - see docs/PACKAGING.md
      - name: Reclaim the workspace
        if: ${{ runner.environment != 'github-hosted' }}
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          if-no-files-found: error
