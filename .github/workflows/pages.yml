name: Pages

# The repo's markdown as a site: README.md as the index (it carries the demos,
# the comparison, the architecture, packaging and Windows material inline),
# plus what is left in docs/ - CONFIGURATION, TESTING, GLOSSARY, SECURITY, PACKAGING,
# ROADMAP and tldr - which interlink with relative links link-check.yml keeps
# honest.
#
# It also carries one file Jekyll never sees: badges/tests.json, the shields
# endpoint README's tests badge reads. That used to be a number sed'd into
# README.md and committed back to main by ci.yml, which put a bot commit on top
# of the author's on every push; publishing it here keeps the figure generated
# and leaves main alone.
#
# Publishing is live: Settings -> Pages -> Source is set to GitHub Actions, so
# deploy-pages has somewhere to put the site and the badge endpoint answers. If
# that setting is ever turned off the build half here still passes and only the
# deploy has nothing to write to - at which point the README badge goes back to
# rendering `inaccessible`, which is the symptom to recognise.
#
# zizmor flags workflow_run as a dangerous trigger, and it is right about the
# usual shape of the mistake: a privileged run that checks out the head SHA of
# whatever it was triggered by. This one does not. It checks out the default
# ref, the count comes from an API query for the newest green CI run on `main`
# rather than from the triggering run's own artifact, and the `if` on `build`
# takes only pushes - a fork PR whose branch happens to be named `main` cannot
# reach it. Nothing here reads a single attacker-controlled byte.
#
# After CI, and only after CI. There was a `push` trigger here too, on the
# markdown paths, so prose could publish without waiting out the suite - but
# ci.yml runs on *every* push to main with no path filter, so workflow_run
# already covers every commit this would have caught. All the second trigger
# added was a duplicate build and deploy on any push touching a .md, which is
# most of them. The cost of dropping it is latency: the site now lands when CI
# goes green rather than a couple of minutes in. The gain is that it never
# publishes docs from a commit whose tests failed.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pages deploys are not cancellable half-done: a superseded run finishes rather
# than leaving the site mid-swap. (Note the difference from ci.yml, where
# cancelling a superseded PR run is exactly right.)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build (jekyll)
    # Hosted, deliberately, and not vars.RUNNER_LABEL like the rest: this job
    # runs jekyll-build-pages, which is a container action, and then has to
    # chown its root-owned output. Pinning it here is what keeps that seam in
    # one known environment - and it is why this job carries no `Reclaim the
    # workspace` step, unlike every other checkout in this repo. It could never
    # fire on a github-hosted runner.
    runs-on: ubuntu-latest
    # a red CI must not publish, and neither may a fork's PR run - `event`
    # pins it to a push to `main`. The other two triggers have no run to judge.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    timeout-minutes: 10
    # actions: read is for the cross-workflow artifact read below - the site
    # build itself still needs nothing but contents
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # the github-pages gem, i.e. the same Jekyll and the same plugin set
      # github.com would run itself - see _config.yml for which of them the
      # site actually leans on
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      # The tests badge, in three steps, all of them after Jekyll has run: the
      # file is written straight into _site, so it needs no front matter and no
      # _config.yml exclusion to survive the build untouched.
      #
      # The lookup is by query rather than off the workflow_run payload on
      # purpose - the newest green CI run on main *is* the triggering run when
      # that is the event, so one code path serves push and dispatch too.
      - name: Find the CI run that counted the suites
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id="$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
          if [ -n "$run_id" ]; then
            echo "counting from CI run $run_id"
          else
            echo "::warning::no successful CI run on main to read a count from"
          fi

      # continue-on-error, not a gate: an expired artifact is a grey badge, not
      # a failed site deploy
      - name: Fetch that run's totals
        if: steps.ci-run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fast-totals
          path: ${{ runner.temp }}/totals
          run-id: ${{ steps.ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      # the same run, so the lookup above serves both. Separate artifacts because
      # they come from different jobs: the count from `test`, the sizes from
      # `packaging-smoke`.
      - name: Fetch that run's package sizes
        if: steps.ci-run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-sizes
          path: ${{ runner.temp }}/sizes
          run-id: ${{ steps.ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Write the shields endpoint
        env:
          TOTALS: ${{ runner.temp }}/totals/totals
          SIZES: ${{ runner.temp }}/sizes/sizes
        run: |
          set -euo pipefail
          # jekyll-build-pages is a *container* action - it runs as root inside
          # docker, so _site comes back root-owned while this step runs as the
          # runner user, and a plain mkdir under it is denied. Same ownership
          # seam the workspace-reclaim step above exists for, reached a
          # different way, so it gets the same one-line answer.
          sudo chown -R "$(id -u):$(id -g)" _site
          mkdir -p _site/badges
          passed=""
          # four fields: passed failed skipped selected (tests/test_runner.sh).
          # Redirect rather than pipe - `read` in a pipeline reads into a
          # subshell and the value never comes back.
          # `|| true`, or set -e takes the missing-file case out with it
          [ -f "$TOTALS" ] && read -r passed _ _ _ <"$TOTALS" || true
          if [ -n "$passed" ]; then
            printf '{"schemaVersion":1,"label":"tests","message":"%s passed","color":"4c1","cacheSeconds":300}\n' \
              "$passed" >_site/badges/tests.json
            echo "tests badge: $passed passed"
          else
            printf '{"schemaVersion":1,"label":"tests","message":"unknown","color":"inactive","cacheSeconds":300}\n' \
              >_site/badges/tests.json
            echo "::warning::no fast-totals to read - tests badge published as unknown"
          fi

          # README's package badge. Two figures in one message on purpose: the
          # deb is the download, the staging tree is what lands on disk, and a
          # badge showing only the smaller one would read as the whole cost.
          deb="" installed=""
          [ -f "$SIZES" ] && read -r deb installed <"$SIZES" || true
          if [ -n "$deb" ] && [ -n "$installed" ]; then
            printf '{"schemaVersion":1,"label":"package","message":"%s KB deb / %s KB installed","color":"4c1","cacheSeconds":300}\n' \
              "$(((deb + 512) / 1024))" "$(((installed + 512) / 1024))" >_site/badges/package.json
            echo "package badge: $deb B deb, $installed B installed"
          else
            printf '{"schemaVersion":1,"label":"package","message":"unknown","color":"inactive","cacheSeconds":300}\n' \
              >_site/badges/package.json
            echo "::warning::no package-sizes to read - package badge published as unknown"
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  # split from the build so the write scopes live on the one job that needs
  # them, and the build stays read-only like every other job here
  deploy:
    name: deploy
    needs: build
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
