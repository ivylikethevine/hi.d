name: Pages

# The repo's markdown as a site: README.md as the index (it carries the demos,
# the comparison, the architecture, packaging and Windows material inline),
# plus what is left in docs/ - CONFIGURATION, TESTING, GLOSSARY, SECURITY, PACKAGING,
# ROADMAP and tldr - which interlink with relative links link-check.yml keeps
# honest.
#
# The build half is entirely in this file. The *publishing* half is one click
# that only exists once the repo is public: Settings -> Pages -> Source:
# GitHub Actions. Until then this is dispatch-only in practice - the push
# trigger below is harmless without that setting, since deploy-pages is what
# needs it and it simply has nothing to deploy to.
on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "_config.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pages deploys are not cancellable half-done: a superseded run finishes rather
# than leaving the site mid-swap. (Note the difference from ci.yml, where
# cancelling a superseded PR run is exactly right.)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build (jekyll)
    runs-on: "ubuntu-latest"
    # runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # hands the persistent self-hosted workspace back to the runner user, so
      # checkout's own cleanup can always finish - see docs/PACKAGING.md
      - name: Reclaim the workspace
        if: ${{ runner.environment != 'github-hosted' }}
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # the github-pages gem, i.e. the same Jekyll and the same plugin set
      # github.com would run itself - see _config.yml for which of them the
      # site actually leans on
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  # split from the build so the write scopes live on the one job that needs
  # them, and the build stays read-only like every other job here
  deploy:
    name: deploy
    needs: build
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
